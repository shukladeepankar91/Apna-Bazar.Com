<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Site for Mobiles, Electronics, Furniture, Grocery & More</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Flipkart Style Header -->
    <header class="navbar">
        <div class="logo">FlipkartClone</div>
        <div class="search-bar">
            <input type="text" placeholder="Search for products, brands and more">
        </div>
        <div class="nav-links">
            <button class="login-btn">Login</button>
            <a href="#" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <!-- Main Banner Section -->
    <section class="banner">
        <h2>Big Billion Days Coming Soon!</h2>
        <p>Grab the best deals on Electronics, TVs, and more.</p>
    </section>

    <!-- Products Section -->
    <main class="main-container">
        <h3>Top Deals on Televisions & Electronics</h3>
        <div class="product-grid" id="product-grid">
            <!-- Products will be loaded dynamically via JavaScript -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
