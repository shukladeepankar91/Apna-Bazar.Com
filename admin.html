<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna-Bazar - Admin Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f1f3f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #2874f0; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="file"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: #2874f0; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #1e5bc6; }
        #login-section { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #2874f0; color: white; }
        img { width: 40px; height: 40px; object-fit: contain; margin: 2px; }
        .action-btns button { padding: 5px 10px; margin: 2px; cursor: pointer; border: none; border-radius: 3px; font-weight: bold; }
        .btn-stock { background: #ff9f00; color: white; }
        .btn-delete { background: #ff4d4d; color: white; }
    </style>
</head>
<body>

    <div id="login-section">
        <h2>Admin Login</h2>
        <div class="form-group" style="text-align: left;">
            <label>Password (default: admin123)</label>
            <input type="password" id="admin-pass" placeholder="Enter password">
        </div>
        <button class="btn" onclick="checkLogin()">Login</button>
    </div>

    <div id="admin-dashboard" class="container" style="display: none;">
        <h2>Admin Dashboard - Multiple Photos & Video</h2>
        
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="p-title" placeholder="e.g. Samsung Smart TV">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="text" id="p-price" placeholder="e.g. ₹24,999">
        </div>
        <div class="form-group">
            <label>Upload 3-4 Product Photos (Select multiple)</label>
            <input type="file" id="p-imgs" accept="image/*" multiple>
        </div>
        <div class="form-group">
            <label>Video URL (YouTube Link or MP4 link)</label>
            <input type="text" id="p-video" placeholder="https://www.youtube.com/embed/...">
        </div>
        <button class="btn" onclick="addNewProduct()">Add Product to Store</button>

        <h3 style="margin-top: 30px;">Products List</h3>
        <table>
            <thead>
                <tr>
                    <th>Images</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
        </table>
        <a href="index.html" style="display:inline-block; margin-top:20px; color:#2874f0; text-decoration:none; font-weight:bold;">← Go back to Live Store</a>
    </div>

    <script>
        function checkLogin() {
            if(document.getElementById("admin-pass").value === "admin123") {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("admin-dashboard").style.display = "block";
                loadAdminProducts();
            } else { alert("Galat password!"); }
        }

        function loadAdminProducts() {
            let products = JSON.parse(localStorage.getItem('apna_bazar_products')) || [];
            const tbody = document.getElementById("product-table-body");
            if(products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5">Koi product nahi hai!</td></tr>`;
                return;
            }
            tbody.innerHTML = products.map((p, index) => `
                <tr>
                    <td>${p.images.map(img => `<img src="${img}">`).join('')}</td>
                    <td>${p.title}</td>
                    <td>${p.price}</td>
                    <td>${p.status || 'In Stock'}</td>
                    <td class="action-btns">
                        <button class="btn-stock" onclick="toggleStock(${index})">Stock</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function addNewProduct() {
            const title = document.getElementById("p-title").value;
            const price = document.getElementById("p-price").value;
            const video = document.getElementById("p-video").value;
            const fileInput = document.getElementById("p-imgs");

            if(title && price && fileInput.files.length > 0) {
                let imagesArray = [];
                let filesProcessed = 0;

                for(let i = 0; i < Math.min(fileInput.files.length, 4); i++) {
                    const reader = new FileReader();
                    reader.readAsDataURL(fileInput.files[i]);
                    reader.onload = function(e) {
                        imagesArray.push(e.target.result);
                        filesProcessed++;
                        
                        if(filesProcessed === Math.min(fileInput.files.length, 4) || filesProcessed === fileInput.files.length) {
                            let products = JSON.parse(localStorage.getItem('apna_bazar_products')) || [];
                            products.push({
                                title: title,
                                price: price,
                                images: imagesArray,
                                video: video,
                                status: "In Stock",
                                reviews: []
                            });
                            localStorage.setItem('apna_bazar_products', JSON.stringify(products));
                            loadAdminProducts();
                            alert("Product 3-4 photos ke sath add ho gaya!");
                            document.getElementById("p-title").value = "";
                            document.getElementById("p-price").value = "";
                            document.getElementById("p-video").value = "";
                            fileInput.value = "";
                        }
                    };
                }
            } else {
                alert("Kripya title, price aur kam se kam 1 photo select karein!");
            }
        }

        function toggleStock(index) {
            let products = JSON.parse(localStorage.getItem('apna_bazar_products')) || [];
            products[index].status = products[index].status === 'Out of Stock' ? 'In Stock' : 'Out of Stock';
            localStorage.setItem('apna_bazar_products', JSON.stringify(products));
            loadAdminProducts();
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('apna_bazar_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('apna_bazar_products', JSON.stringify(products));
            loadAdminProducts();
        }
    </script>
</body>
</html>
